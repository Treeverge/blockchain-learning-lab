name: Learning model checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: node --test tests/amm.test.cjs tests/lp.test.cjs tests/lending.test.cjs
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --check assets/js/exchange.js
      - run: node --check assets/js/liquidity.js
      - run: node --check assets/js/borrow.js

name: Learning model checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r 04-六天实战源码/day2-python-blockchain/requirements-learning.txt
      - run: node --test tests/amm.test.cjs tests/lp.test.cjs tests/lending.test.cjs tests/chain.test.cjs tests/utxo.test.cjs tests/network.test.cjs tests/account.test.cjs tests/security.test.cjs tests/curriculum.test.cjs
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m unittest discover -s tests -p 'test_*.py'
        working-directory: 04-六天实战源码/day2-python-blockchain
      - run: node --check assets/js/exchange.js
      - run: node --check assets/js/liquidity.js
      - run: node --check assets/js/borrow.js
      - run: node --check assets/js/chain-lab.js
      - run: node --check assets/js/utxo-lab.js
      - run: node --check assets/js/network-lab.js
      - run: node --check assets/js/account-lab.js
      - run: node --check assets/js/security-lab.js
      - run: node --check assets/js/learning-path.js
      - run: node --check assets/js/presentation.js
      - run: python scripts/build-manuscript.py --check
      - run: npm install --prefix "$RUNNER_TEMP/account-validation" --no-audit --no-fund solc@0.8.20 ethers@6.13.4 ganache@7.9.2
      - run: node tests/account-solidity-check.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/account-validation/node_modules
      - run: node tests/security-solidity-check.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/account-validation/node_modules
